<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>Sorteio São Paulo</title><style>
:root{--blue:#2563eb;--green:#16a34a;--bg:#f4f6f8;--line:#dce2ea;--text:#172033;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.page{width:min(100% - 20px,620px);margin:auto;padding:18px 0 95px}h1{text-align:center;font-size:25px;margin:5px 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 4px 14px #0f172a0d}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}h2{font-size:17px;margin:0}.count{font-size:12px;color:var(--muted);font-weight:bold}.tools{display:flex;gap:7px;margin-bottom:11px}.small{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-weight:bold;color:#334155}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.option{position:relative}.option input{position:absolute;opacity:0}.option label{display:flex;align-items:center;justify-content:center;min-height:47px;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fff;text-align:center;font-size:16px;font-weight:bold;cursor:pointer;user-select:none}.places input:checked+label{color:#fff;background:var(--green);border-color:var(--green)}.names input:checked+label{color:var(--blue);background:#eff6ff;border:2px solid var(--blue)}.names input:checked+label:after{content:' ✓';margin-left:5px}.message{display:none;margin-top:10px;padding:10px;border-radius:9px;background:#fff1f2;color:#be123c;text-align:center;font-size:14px;font-weight:bold}.result{display:none}.result.show{display:block}.result h2,.weather h2{text-align:center;margin-bottom:11px}.row{display:grid;grid-template-columns:100px 1fr;border:1px solid var(--line);border-bottom:0}.row:first-child{border-radius:10px 10px 0 0}.row:last-child{border-bottom:1px solid var(--line);border-radius:0 0 10px 10px}.place,.list{padding:12px}.place{font-weight:bold;background:#f8fafc;border-right:1px solid var(--line)}.list{line-height:1.45}.time{text-align:center;color:var(--muted);font-size:12px}.copy{width:100%;min-height:48px;border:0;border-radius:11px;background:#0f766e;color:#fff;font-size:16px;font-weight:bold}.copy.ok{background:#15803d}.weather-box{display:flex;align-items:center;justify-content:center;gap:12px;min-height:66px;text-align:left}.weather-icon{font-size:34px}.weather-info{font-size:14px;line-height:1.5}.weather-info strong{font-size:17px}.weather-status{text-align:center;color:var(--muted);font-size:14px}.bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#f4f6f8ee;border-top:1px solid var(--line)}.draw{display:block;width:min(100%,620px);min-height:53px;margin:auto;border:0;border-radius:13px;background:var(--blue);color:#fff;font-size:19px;font-weight:bold;box-shadow:0 6px 16px #2563eb3d}nav{text-align:center;font-size:14px;margin:17px 0}nav a{color:var(--blue);font-weight:bold;text-decoration:none}@media(min-width:520px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main class="page"><h1>Sorteio São Paulo</h1>
<section class="card"><div class="head"><h2>Selecione os nomes</h2><span class="count" id="nc">0 selecionados</span></div><div class="tools"><button class="small" id="all">Selecionar todos</button><button class="small" id="clear">Limpar</button></div><div class="grid names" id="names"><span>Carregando...</span></div></section>
<section class="card"><div class="head"><h2>Selecione os lugares</h2><span class="count" id="pc">4 selecionados</span></div><div class="grid places"><div class="option"><input type="checkbox" name="local" id="altar" value="Altar" checked><label for="altar">Altar</label></div><div class="option"><input type="checkbox" name="local" id="frente" value="Frente" checked><label for="frente">Frente</label></div><div class="option"><input type="checkbox" name="local" id="fundo" value="Fundo" checked><label for="fundo">Fundo</label></div><div class="option"><input type="checkbox" name="local" id="vestiario" value="Vestiário" checked><label for="vestiario">Vestiário</label></div></div><div class="message" id="msg"></div></section>
<section class="card result" id="result"><h2>Resultado</h2><div id="rows"></div><p class="time" id="time"></p><button class="copy" id="copy">COPIAR RESULTADO</button></section>
<section class="card weather"><h2>Previsão do tempo</h2><div class="weather-box" id="weather"><span class="weather-status">Carregando...</span></div></section><nav><a href="ma.html">Ir para Mairiporã</a></nav></main><div class="bottom"><button class="draw" id="draw">Realizar sorteio</button></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let last=null,weatherText='Previsão indisponível';const checked=n=>$$(`input[name="${n}"]:checked`);function counts(){let n=checked('nome').length,p=checked('local').length;$('#nc').textContent=`${n} selecionado${n==1?'':'s'}`;$('#pc').textContent=`${p} selecionado${p==1?'':'s'}`}function option(name,i){let d=document.createElement('div');d.className='option';let x=document.createElement('input');x.type='checkbox';x.name='nome';x.id='n'+i;x.value=name;let l=document.createElement('label');l.htmlFor=x.id;l.textContent=name;d.append(x,l);return d}fetch('nomes.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{let a=[...new Set(t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];$('#names').innerHTML='';a.forEach((n,i)=>$('#names').append(option(n,i)));counts()}).catch(()=>$('#names').innerHTML='<span>Erro ao carregar nomes.txt</span>');document.addEventListener('change',counts);$('#all').onclick=()=>{$$('input[name="nome"]').forEach(x=>x.checked=true);counts()};$('#clear').onclick=()=>{$$('input[name="nome"]').forEach(x=>x.checked=false);counts()};function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}$('#draw').onclick=()=>{let names=checked('nome').map(x=>x.value),places=checked('local').map(x=>x.value);if(!names.length||!places.length){$('#msg').textContent='Selecione pelo menos um nome e um lugar.';$('#msg').style.display='block';return}$('#msg').style.display='none';let out={};places.forEach(p=>out[p]=[]);shuffle(names).forEach((n,i)=>out[places[i%places.length]].push(n));$('#rows').innerHTML='';Object.entries(out).forEach(([p,a])=>{let r=document.createElement('div');r.className='row';let p1=document.createElement('div');p1.className='place';p1.textContent=p;let p2=document.createElement('div');p2.className='list';p2.textContent=a.join(', ')||'—';r.append(p1,p2);$('#rows').append(r)});let now=new Date();$('#time').textContent=now.toLocaleString('pt-BR');last={out,now};$('#result').classList.add('show');$('#result').scrollIntoView({behavior:'smooth'})};
function wi(c){return({0:['☀️','Céu limpo'],1:['🌤️','Predominantemente limpo'],2:['⛅','Parcialmente nublado'],3:['☁️','Nublado'],45:['🌫️','Neblina'],48:['🌫️','Neblina'],51:['🌦️','Garoa leve'],53:['🌦️','Garoa'],55:['🌧️','Garoa forte'],61:['🌧️','Chuva leve'],63:['🌧️','Chuva'],65:['🌧️','Chuva forte'],80:['🌦️','Pancadas leves'],81:['🌧️','Pancadas de chuva'],82:['⛈️','Pancadas fortes'],95:['⛈️','Trovoadas'],96:['⛈️','Trovoadas'],99:['⛈️','Trovoadas']})[c]||['🌡️','Tempo variável']}async function loadWeather(){try{let u='https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FSao_Paulo&forecast_days=1',r=await fetch(u);if(!r.ok)throw 0;let d=await r.json(),[ic,ds]=wi(d.current.weather_code),t=Math.round(d.current.temperature_2m),mi=Math.round(d.daily.temperature_2m_min[0]),ma=Math.round(d.daily.temperature_2m_max[0]),ch=d.daily.precipitation_probability_max[0]??0;weatherText=`${ds}, ${t}°C agora | Mín. ${mi}°C / Máx. ${ma}°C | Chuva: ${ch}%`;$('#weather').innerHTML=`<span class="weather-icon">${ic}</span><div class="weather-info"><strong>${t}°C — ${ds}</strong><br>Mín. ${mi}°C · Máx. ${ma}°C · Chuva ${ch}%</div>`}catch{$('#weather').innerHTML='<span class="weather-status">Previsão indisponível no momento.</span>'}}function text(){let d=last.now.toLocaleDateString('pt-BR'),h=last.now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),a=['🎯 *SORTEIO SÃO PAULO*','',`📅 ${d} às ${h}`,''];Object.entries(last.out).forEach(([p,n])=>{a.push(`📍 *${p}*`,...(n.length?n.map(x=>'• '+x):['• —']),'')});a.push('🌤️ *PREVISÃO DO TEMPO*',weatherText);return a.join('\n').trim()}$('#copy').onclick=async function(){if(!last)return;let t=text();try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.append(a);a.select();document.execCommand('copy');a.remove()}this.textContent='✓ RESULTADO COPIADO';this.classList.add('ok');setTimeout(()=>{this.textContent='COPIAR RESULTADO';this.classList.remove('ok')},2000)};loadWeather();
</script></body></html>

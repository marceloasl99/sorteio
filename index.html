<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="Select a location to start the team draw.">
    <title>Team Draw</title>
    <style>
        :root {
            --background: #f4f6f8;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #dce2ea;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 460px);
            padding: 26px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .icon {
            display: grid;
            place-items: center;
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: #eff6ff;
            color: var(--primary);
            font-size: 28px;
        }

        h1 {
            margin: 0;
            font-size: 27px;
        }

        p {
            margin: 9px 0 22px;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.5;
        }

        .locations {
            display: grid;
            gap: 12px;
        }

        .location {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: #ffffff;
            color: var(--text);
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            transition: border-color 0.15s, background-color 0.15s, transform 0.15s;
        }

        .location:hover,
        .location:focus-visible {
            border-color: var(--primary);
            background: #eff6ff;
            outline: none;
        }

        .location:active {
            transform: scale(0.99);
        }

        .arrow {
            color: var(--primary);
            font-size: 22px;
        }

        footer {
            margin-top: 20px;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            main {
                padding: 22px 15px;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">🎯</div>
        <h1>Team Draw / Sorteio</h1>
        <p>Select a location to start the draw.</p>

        <nav class="locations" aria-label="Available locations">
            <a class="location" href="sp.html">
                <span>São Paulo</span>
                <span class="arrow" aria-hidden="true">›</span>
            </a>

            <a class="location" href="ma.html">
                <span>Mairiporã</span>
                <span class="arrow" aria-hidden="true">›</span>
            </a>
        </nav>

        <footer>No installation required.</footer>
    </main>
</body>
</html>
